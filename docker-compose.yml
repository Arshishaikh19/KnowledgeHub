version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: knowledgehub-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=knowledgehub
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Ingestion Queue
  redis:
    image: redis:7.2-alpine
    container_name: knowledgehub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Express Backend API (HTTP Service)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgehub-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/knowledgehub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=knowledgehub_super_secret_jwt_key_2026
      - STORAGE_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  # 4. Background Ingestion Worker (Separate Process, Scalable)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/knowledgehub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PROVIDER=local
      - WORKER_CONCURRENCY=5
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  # 5. Next.js Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgehub-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=knowledgehub_nextauth_secret_key_2026
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  upload_data:
